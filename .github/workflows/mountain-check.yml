name: Mountain regression checks
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'models/goat-mountain*'
      - 'tests/**'
      - '.github/workflows/mountain-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mountain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load full mountain and test transport
        run: node --experimental-default-type=module --test tests/mountain-snow.test.mjs tests/island-transport.test.mjs
