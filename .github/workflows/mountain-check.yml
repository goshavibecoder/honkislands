name: Island loading checks
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'models/goat-mountain*'
      - 'tests/**'
      - '.github/workflows/mountain-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mountain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load full mountain and test transport
        run: node --experimental-default-type=module --test --test-force-exit tests/mountain-open.test.mjs
      - name: Interrupted asset recovery checks
        run: node --experimental-default-type=module --test tests/asset-loader.test.mjs
      - name: Mountain geometry and gameplay checks
        run: node --experimental-default-type=module --test tests/mountain-snow.test.mjs tests/island-transport.test.mjs
      - name: Open all islands using published assets
        env:
          HONK_LIVE_BASE: https://honkler.org/
        run: node --experimental-default-type=module --test --test-force-exit tests/mountain-open.test.mjs
